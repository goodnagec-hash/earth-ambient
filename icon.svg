<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#101217"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <ellipse cx="256" cy="256" rx="170" ry="66" transform="rotate(-24 256 256)"
           fill="none" stroke="#ff6b00" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="392" cy="180" r="18" fill="#ff6b00" filter="url(#glow)"/>
</svg>
